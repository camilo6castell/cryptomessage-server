plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.2'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.cryptomessage'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // SPRING
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // SWAGGER
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'

    // JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // DB DRIVERS — ambos en classpath; el perfil activo determina cuál se usa
    // dev  → MariaDB local (application-dev.properties)
    // prod → MySQL/Aiven (application-prod.properties)
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client:3.4.1'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

    // SECURITY
    implementation 'org.springframework.boot:spring-boot-starter-security'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // ARCHITECTURE TESTS — enforce the layer boundaries package-based Hexagonal
    // relies on (no compiler module boundary here, unlike Library Provider's
    // multi-module Gradle layout — see docs/MIGRATION_NOTES.md for why).
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.0'
}

tasks.named('test') {
    useJUnitPlatform()
}
